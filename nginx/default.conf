server {
    listen 80;
    server_name s3.tharisha.site;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name s3.tharisha.site;

    ssl_certificate /etc/letsencrypt/live/s3.tharisha.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s3.tharisha.site/privkey.pem;

    # redirection floci to floci ui
    location = /floci {
        return 302 /_floci/ui;
    }
    location = /floci/ {
        return 302 /_floci/ui;
    }
    # floci ui
    location ^~ /_floci/ {
        proxy_pass http://floci:4566;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:5173;
        proxy_set_header Host $host;
    }

    location = /api/health {
        proxy_pass http://backend:3000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}